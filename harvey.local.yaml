persona:
  name: "PREENCHER"                       # quem assina os e-mails (nome real)
  company: "SGV Gestão Integrada"
  role: "Desenvolvimento de Negócios"
  email: "PREENCHER@dominio-secundario.com.br"  # caixa de envio (domínio secundário, nunca o principal)
  linkedin: ""
  tone: "próximo, direto, consultivo, de quem conhece a operação por dentro"

product:
  name: "SGV Gestão Integrada"
  description: "Construímos, desenvolvemos e fazemos a gestão de empreendimentos turísticos no Sul do Brasil: da análise e projeto de uma área com potencial turístico até a operação do dia a dia de pousadas, hotéis e parques."
  pricing: "Sob consulta, conforme o projeto"
  key_benefits:
    - "Gestão completa da operação de pousadas, hotéis e parques, para o dono deixar de tocar o dia a dia"
    - "Transformamos terras e fazendas com potencial turístico em empreendimentos estruturados, do estudo de viabilidade à obra"
    - "Projetos de multipropriedade e cotas com estrutura, construção e gestão sob o mesmo time"
    - "Experiência na região da Serra Geral, onde construímos e operamos"
  objection_responses:
    "too expensive": "Faz sentido olhar o custo. Normalmente comparamos com o que a operação deixa de faturar hoje e com o tempo que você gasta nela. Quer que eu faça essa conta com os seus números?"
    "already have a solution": "Entendo. Se tivesse uma coisa que você gostaria que funcionasse melhor na gestão de hoje, qual seria?"
    "not interested": "Sem problema. Obrigado pelo retorno e não te escrevo mais."
    "not the right time": "Entendo. Faz sentido eu voltar a falar com você antes da próxima alta temporada?"
    "I want to keep control": "Totalmente compreensível. A gestão pode ser parcial, só nas áreas que mais tomam seu tempo, e você segue decidindo o que importa."
  offer:
    primary: "Gestão integrada de empreendimentos turísticos (operação, desenvolvimento e construção)"
    entry: "Diagnóstico inicial do empreendimento ou da área, em uma conversa"
    goal: "book_call"
    booking_method: "ask_preference"
    booking_url: ""
    meeting_duration: "30 minutos"
    meeting_owner: "PREENCHER"

