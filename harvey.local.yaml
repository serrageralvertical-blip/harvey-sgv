channels:
  email:
    enabled: true
    provider: "gmail"
    max_daily_sends: 30
    require_approval: true      # todo e-mail espera sua aprovação no Outbox
    send_to_risky: false
    max_bounce_rate: 0.05
    warmup:
      start_date: ""            # AAAA-MM-DD do dia em que o aquecimento do domínio começou
      min_days: 14
      start_sends: 5
      daily_increase: 3
      dkim_selector: ""
  linkedin:
    enabled: false
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "20:00"
    end: "08:00"
    timezone: "America/Sao_Paulo"

compliance:
  # LGPD: identifique a empresa e ofereça um jeito simples de sair.
  postal_address: "PREENCHER: razão social, CNPJ e endereço"
  opt_out_line: 'Não quer receber mais e-mails? Responda "sair" e eu não escrevo mais.'
  precleared:
    enabled: false              # só cobre leis de EUA/Europa; não se aplica ao Brasil
    sender_country: ""
    address_source: "published"
    prospect_country: "BR"
